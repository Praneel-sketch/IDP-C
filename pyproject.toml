[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citychange"
version = "1.0.0"
description = "CityChange: urban evolution intelligence from open Earth-observation data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
]

[project.scripts]
citychange = "citychange.cli:main"

[tool.setuptools.packages.find]
include = ["citychange*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
